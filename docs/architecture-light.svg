<path class="w" d="M599 181H617" marker-end="url(#ah-w)"/><circle class="p" cx="599" cy="181" r="3"/>
<path class="w" d="M208 260V312" marker-start="url(#ah-w)" marker-end="url(#ah-w)"/><text class="wl" x="218" y="292">Sync</text>
<path class="w" d="M588 260V312" marker-start="url(#ah-w)" marker-end="url(#ah-w)"/><text class="wl" x="598" y="292">Encrypted</text>
<path class="w" d="M208 414V466" marker-start="url(#ah-w)" marker-end="url(#ah-w)"/>
<path class="w" d="M588 414V466" marker-start="url(#ah-w)" marker-end="url(#ah-w)"/>
</svg>
